# per run drops. edit freely.
# the api does not expose drop tables to api keys, so these come from the
# "drops a win" panel on the maps page and from your own farm logs.
#
# short: name shown in /ev (15 chars max). diff: 5 chars max.
# stars and item amounts are a number or [min, max]. the average used is the
# middle of the range. to use a measured average instead, write
#   replay_2: {range: [0, 1], avg: 77/120}      # 77 drops over 120 runs
# a mods block adds mod drops priced at the lbin of each type and star level:
#   mods: {count: 2, types: [ht, sd, dt], rarity: {4: 0.9, 5: 0.1}}
#   = 2 mods a win, each a random type from the list, 90% 4 star, 10% 5 star.
# estimated: true puts a * next to the map in /ev.

# item id -> name shown in /prices. every id here is priced.
items:
  fuel: fuel
  replay_1: bronze replay
  replay_2: silver replay
  replay_3: gold replay
  mod_fragment: mod fragment
  insignia_tank_2: tank insig 2
  insignia_tank_3: tank insig 3
  insignia_dps_2: dps insig 2
  insignia_dps_3: dps insig 3
  insignia_support_2: supp insig 2
  insignia_support_3: supp insig 3
  insignia_cc_2: mage insig 2
  insignia_cc_3: mage insig 3

# drops nobody buys, so /ev counts them as 0 while likely_to_sell is on (the default).
# they can still have a stray listing, so /prices shows them. /ev likely_to_sell:false counts them.
no_sale:
  - insignia_tank_2
  - insignia_support_2
  - insignia_cc_2

maps:
  # galactic. measured over 250 runs: 478 bronze, 153 silver.
  # stars checked over 79 of them: 38,012 = 481 a run, so the 440-520 midpoint holds.
  - map: galaxy collapse
    short: galaxy collapse
    diff: gal
    stars: [440, 520]
    items:
      replay_1: {range: [1, 3], avg: 478/250}
      replay_2: {range: [0, 1], avg: 153/250}

  # top difficulty, no stars. mage insignia is insignia_cc on the market.
  - map: the big black
    short: the big black
    diff: top
    stars: 0
    items:
      insignia_tank_2: 1
      insignia_tank_3: [1, 2]
      insignia_dps_2: 1
      insignia_dps_3: [1, 2]

  - map: freedom dive
    short: freedom dive
    diff: top
    stars: 0
    items:
      insignia_support_2: 1
      insignia_support_3: [1, 2]
      insignia_cc_2: 1
      insignia_cc_3: [1, 2]

  # top difficulty: 65-85 mod fragments and 2 mods a win, no stars. each mod's
  # type is picked at random, so every type listed gets an equal share.
  - map: remote control
    short: remote control
    diff: top
    stars: 0
    items:
      mod_fragment: [65, 85]
    mods: {count: 2, types: [ht, sd, dt], rarity: {4: 0.9, 5: 0.1}}

  - map: everything will freeze
    short: will freeze
    diff: top
    stars: 0
    items:
      mod_fragment: [65, 85]
    mods: {count: 2, types: [nf, hd, pf], rarity: {4: 0.9, 5: 0.1}}

  - map: scarlet rose
    short: scarlet rose
    diff: top
    stars: 0
    items:
      mod_fragment: [65, 85]
    mods: {count: 2, types: [ez, hr, so], rarity: {4: 0.9, 5: 0.1}}

  - map: shiori
    short: shiori
    diff: top
    stars: 0
    items:
      mod_fragment: [65, 85]
    mods: {count: 2, types: [fl, nc, rx], rarity: {4: 0.9, 5: 0.1}}

  # still needed: the lower difficulties of every map.
